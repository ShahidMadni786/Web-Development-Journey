<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caluclator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
     <div class="calculator">

     <input type="text" placeholder="0" id="input">
  <div class="btns">
    <button class="operator" style="color: #6dee0a;;">AC</button>
    <button class="operator" style="color: #6dee0a;;">DEL</button>
    <button class="operator" style="color: #6dee0a;;">%</button>
    <button class="operator" style="color: #6dee0a;;">/</button> 
</div>
<div class="btns">
    <button>7</button>
    <button>8</button>
    <button>9</button>
    <button class="operator" style="color: #6dee0a;">*</button> 
</div>
<div class="btns">
    <button>4</button>
    <button>5</button>
    <button>6</button>
    <button class="operator" style="color: #6dee0a;">-</button> 
</div>
<div class="btns">
    <button>1</button>
    <button>2</button>
    <button>3</button>
    <button class="operator" style="color: #6dee0a;">+</button> 
</div>
<div class="btns">
    <button>00</button>
    <button>0</button>
    <button>.</button>
    <button class="equal" style=" background-color: #fb7c14;">=</button> 
</div>
     </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
