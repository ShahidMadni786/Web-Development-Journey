<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css">
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
</head>
<body>
    <div class="big-box">
      <div class="box-h2">
       <h2> Currency Converter</h2>
      </div>
   <form action="">
     <div class="input">
        <label for="amount">Enter Amount</label>
        <input type="number" id="amount">
     </div>
   <div class="from">
    <div class="select">
        <p>From</p>
       <div class="flagwala">
        <img id="fromflag" src="https://flagsapi.com/US/flat/64.png" />
      
        <select name="country" id="from">
           
            <!-- <option value="">PAK</option>
            <option value="">IND</option>
            <option value="">USD</option>
            <option value="">GER</option> -->
        </select>
    </div>
    </div>
    <div class="opposit"><i class="fa-solid fa-arrow-right-arrow-left  " style="filter: invert(1); font-size: 22px;"></i></div>
    <div class="to">
        <p>TO</p>
        <div class="flagwala">
         <img id="toflag" src="https://flagsapi.com/PK/flat/64.png" />
       
         <select name="country" id="to">
            
             <!-- <option value="">PAK</option>
             <option value="">IND</option>
             <option value="">AUD</option>
             <option value="">GER</option> -->
         </select>
     </div>
    </div>
   </div>
   <div class="msg" style="margin-top: 2rem;"><p id="msg" style="text-align: center; font-size: 20px; font-weight: 700; color: yellow;"></p></div>
   <div class="btn-1">
   <button id="btn1" class="btn">Get Exchange Rate</button>
</div></form>
    </div>

    <script src="code.js"></script>
    <script src="script.js"></script>
   
</body>
</html>
