<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website layout</title>
    <style>
        
@import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

  *{
    margin: 0;
    padding: 0;
    font-family: Poppins;
  }
  nav ul li{
    list-style: none;
    padding: 16px;
    position: relative;
    left: 39%;
    color: white;
    
  }
  ul{
    display: flex;
    
  }
  header{
    position: sticky;
    top:0;
  }
  .nav{
    margin: auto;
    background-color: rgb(67, 11, 222);
    
  }
 a:link{
    
    text-decoration: none;
 }
 a:visited{
    color: white;
 }
.sec{
    border: 2px solid black;
    width : 40%;
    height: 70vh;
    margin: 18px;
    margin-right: 145px;
    display: inline-block;
    background-color: yellow;
}
.sec2{
    border: 2px solid black;
   width : 40%;
   height: 70vh;
    margin: 18px;
    margin-left: 145px;
    
    background-color: red;
    
}
main{
    background-color: black;
    padding: 45px;
}


.radial{
   
   border: 2px solid white;
   width:1277px;
   height: 235px;px;
   margin: auto;
   position: relative;
   top: 45px;
   border-radius: 35px;
   
}
.container{
    display: flex;
    background-color: green;
    /* width: 1456px; */
    margin: 12px 34px;
    text-align: center;
    padding: 12px;
  
}
p{
    color: white;
   font-size: 24px;
   text-align: center;
   position: relative;
   top: 80px;

}
.footer{
    text-align: center;
    height: 32px;
}
.btn{
   position: fixed;
   bottom: 12px;
   right: 12px;
   padding: 10px 20px;
   color: white;
   background-color: red;
   

  }

    </style>
</head>
<body>
    
    <header>
        <nav class="nav">
        
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/">About</a></li>
                <li><a href="/">Contact us</a></li>
                <li><a href="/">Our Services</a></li>
            </ul>
        
        </nav>
    </header>
    <main>
        
            <div class="container">
            <div class="sec">this is first section</div>
            <div class="sec2">this is 2nd box</div>
        </div>
        
    
         <div class="radial"><p>Welcome to Sigma Web Development course</p></div>
         <button class="btn">click me</button>
       

    </main>
    <footer class="footer">copyright &copy; 2024 Shahid-Madni</footer>
