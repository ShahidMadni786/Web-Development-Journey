<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display property</title>
    <style>
        /* * {
            margin: 0;
            padding: 0;
        } */

        .box {
            background-color: yellow;
            color: red;
            border: solid black;
            display: inline-block;
            padding: 45px;
            width: 445px;
        }

        .box1 {
            background-color: rgb(17, 234, 234);
            color: red;
            border: solid black;
            display: inline-block;
            padding: 45px;
            width: 445px;
        }

        .container {
            background-color: rgb(17, 234, 234);
            color: red;
            border: solid black;

        }
    </style>
</head>

<body>
    

    <div class="box">Hello

    </div>
    <div class="box1">Salam</div>
    <span class="container">This is Span</span>
</body>

</html>
