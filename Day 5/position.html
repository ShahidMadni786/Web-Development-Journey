<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positions</title>
     <style>
      
        .container{
            background-color: gray;
            padding: 70px;
            height: 1000px;
            border: 5px solid black;
            position: relative;
            
        }
        .box1, .box2,.box3,.box4{
            display: inline-block;
        }
        .box1{
            background-color: red;
            margin: 6px;
            padding :60px;
        border: 2px solid black;
        
        }
        .box2{
            background-color: yellow;
            margin: 6px;
            padding :60px;
            border: 2px solid black;
            
        }
        .box3{
            background-color: blue;
            margin: 6px;
            padding :60px;
        border: 2px solid black;
        position: sticky;
        top: 10px;
                    
        }
        .box4{
            background-color: violet;
            margin: 6px;
            padding :60px;
            border: 2px solid black;
            position: fixed;
        }
        .block{
            background-color: aqua;
            padding: 300px;
            border: 5px solid black;
        }
     </style>
</head>
<body>
    <div class="container">
  <div class="box1"></div>
  <div class="box2"></div>
  <div class="box3"></div>
  <div class="box4"></div>
    </div>
    <div class="block"></div>
</body>
</html>
