<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>card</title>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

@import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap');
*{
    margin: 0;
    padding: 0;
}
        body{
            background-color: gainsboro;
        }
        .card{
            background-color: white;
            width: 285px;
            height: 420px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 2px 2px 1px;
            
        }
       .image{
        position: relative;
        top: 4px;
        left: 4px;
        width: 278px;
        height: 170px;
        border-radius: 10px;
       }
 
        
       
       h2{
        margin-left: 4px;
        font-family: Roboto;
       }
       p{
        margin-left: 4px;
        font-family: Roboto;
        color: rgb(161, 155, 155)
       }
       .btn{
        border: none;
        border-radius: 15px;
        position: relative;
        left: 101px;
        top: 58px;
        font-size: 12px;
        color: rgb(64, 28, 206);
        background-color: rgb(199, 209, 241);
        padding: 8px 10px;
        font-weight: bolder;

       }
       .nature, .lake{
        position: relative;
        left: 17px;
        top: 20px;
        padding: 2px 7px;
        border: 1px solid rgb(90, 88, 88);
        border-radius: 15px;
        color: rgb(84, 84, 85);
       }
       .paragraph{
        padding: 3px 1px 2px 3px;
       position: relative;
        top: 34px;
       }
     
    </style>
</head>
<body>
    <div class="card">
      
        <img src="img1.jpg" alt="card" class="image" >
 <div>

 <span class="nature">Nature</span>  <span class="lake">Lake</span>

 </div>
   <div class="paragraph">
  <h2>Logo the challenge</h2>
  <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Animi, dolor voluptates. Modi exercitationem est blanditiis totam velit voluptatibus!
  </p>
</div>
<div>
  <button class="btn" >Read More</button>
</div>
    </div>
</body>
</html>
