<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML forms</title>
</head>

<body>
    <h1>Welcome to The Forms Of Shahid Madni</h1>
    <form action="post">
        <div>
            <label for="usermame">Username</label>
            <input type="text" id="usermame" name="username" placeholder="enter your username">
        </div>
        <div>
            <b>Select your gender :</b>
            <input type="radio" name="gender" id="male" value="male">
            <label for="male">male</label>

            <input type="radio" name="gender" id="female" value="female">
            <label for="female">female</label>
        </div>
        <div>
            <b>Select your qualification :</b>
            <input type="checkbox" name="Education" id="Master">
            <label for="Master">Master</label>
            <input type="checkbox" name="Education" id="Bechelor">
            <label for="Bechelor">Bechelor</label>
            <input type="checkbox" name="Education" id="PHD">
            <label for="PHD">PHD</label>
        </div>
        <div>
            <label for="comment">Enter your comment :</label>
            <br>
            <textarea name="comment" id="comment"></textarea>

        </div>
        <div><select name="fruits" id="fruits">
                <option value="orange">orange</option>
                <option value="mango">mango</option>
                <option value="apple">apple</option>
            </select>
        </div>
    </form>
</body>

</html>
