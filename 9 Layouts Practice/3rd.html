<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css</title>
    <style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    .container{
        width: 100vw;
        height: 100vh;
        border: 3px solid rgb(108, 4, 4);
        padding: 8px;
        background-color: rgb(8, 8, 8);
        display: grid;
        gap: 1rem;
        grid-template-rows: repeat(3,1fr);
        grid-template-columns: repeat(4,1fr);
    }
    .item{
        background-color: blueviolet;
        color: white;
        border: 2px solid rgb(255, 255, 255);
    }
   .item1{
       grid-column: 1/5;
       grid-row: 1/2;
   }
   .item3{
    grid-column: 2/5;
   }
   .item4{
    grid-row: 3/4;
    grid-column: 1/5;
   }
    </style>
</head>
<body>
   <div class="container">
    <div class="item item1">header</div>
    <div class="item item2">AD</div>
    <div class="item item3">Content</div>
    <div class="item item4">Footer</div>
   </div> 
</body>
</html>
