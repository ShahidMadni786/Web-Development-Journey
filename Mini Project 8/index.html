<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
</head>
<body>

    <!-- Swiper Container -->
    <div class="swiper">
        <!-- Additional required wrapper -->
        <div class="swiper-wrapper">
            <!-- Swiper Slides (your cards go here) -->
            <div class="swiper-slide">
                <div class="cards card1">
                    <div class="card-img"><img src="/img-1.jpg" alt="Michal Brown"></div>
                    <div class="text">
                       <h3>Michal Brown</h3>
                       <p>Project Manager</p>
                    </div>
                    <button>Message</button>
                </div>
            </div>
            
            <div class="swiper-slide">
                <div class="cards card2">
                    <div class="card-img"><img src="/img-2.jpg" alt="Emily Devis"></div>
                    <div class="text">
                       <h3>Emily Devis</h3>
                       <p>Marketing Specialist</p>
                    </div>
                    <button>Message</button>
                </div>
            </div>
            
            <div class="swiper-slide">
                <div class="cards card3">
                    <div class="card-img"><img src="/img-3.jpg" alt="Christopher Garcia"></div>
                    <div class="text">
                       <h3>Christopher Garcia</h3>
                       <p>Data Scientist</p>
                    </div>
                    <button>Message</button>
                </div>
            </div>
            
            <div class="swiper-slide">
                <div class="cards card4">
                    <div class="card-img"><img src="/img-4.jpg" alt="Sara Johnson"></div>
                    <div class="text">
                       <h3>Sara Johnson</h3>
                       <p>Graphics Designer</p>
                    </div>
                    <button>Message</button>
                </div>
            </div>
            
            <div class="swiper-slide">
                <div class="cards card5">
                    <div class="card-img"><img src="/img-5.jpg" alt="James Wilson"></div>
                    <div class="text">
                       <h3>James Wilson</h3>
                       <p>Software Developer</p>
                    </div>
                    <button>Message</button>
                </div>
            </div>
            
            <div class="swiper-slide">
                <div class="cards card6">
                    <div class="card-img"><img src="/img-6.jpg" alt="Laura Thompson"></div>
                    <div class="text">
                       <h3>Laura Thompson</h3>
                       <p>UI/UX Designer</p>
                    </div>
                    <button>Message</button>
                </div>
            </div>
        </div>

        <!-- Pagination -->
        <div class="swiper-pagination"></div>

        <!-- Navigation buttons -->
        <div class="swiper-button-prev"></div>
        <div class="swiper-button-next"></div>

        <!-- Scrollbar -->
        <div class="swiper-scrollbar"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
