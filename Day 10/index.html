<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid</title>
    <style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body{
    width: 100vw;
    height: 100vh;
}

.container{
    width: 100%;
    height: 100%;
     background-color: rgb(61, 54, 54);
     border: 2px solid brown;
     display: grid;
     padding: 15px;
     grid-template-rows: repeat(6,1fr);
     grid-template-columns: repeat(1,1fr);
     gap: 8px 8px;

}
.item{
    border: 2px solid yellow;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
}
/* .header{
    grid-column-start: 1;
    grid-column-end: 4;
}
.footer{
    grid-column-start: 1;
    grid-column-end: 4;
}
.sidebar{
    grid-row-start: 2;
    grid-row-end: 4;
}
.content1{
    grid-column-start: 2;
    grid-column-end: 4;
} */
@media (min-width : 600px) {
    .container{
    grid-template-rows: repeat(4,1fr);
    grid-template-columns: repeat(3,1fr);
    }
    .header{
    grid-column-start: 1;
    grid-column-end: 4;
}
.footer{
    grid-column-start: 1;
    grid-column-end: 4;
}
.sidebar{
    grid-row-start: 2;
    grid-row-end: 4;
}
.content1{
    grid-column-start: 2;
    grid-column-end: 4;
}
}
    </style>
</head>
<body>
    
    <div class="container">
        <div class="item header">header</div>
        <div class="item sidebar">sidebar</div>
        <div class="item content1">Content 1</div>
        <div class="item">item 4</div>
        <div class="item">item 5</div>
        <div class="item footer">Footer</div>
    </div>
</body>
</html>
