<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Rock Papper Scissors Game</h1>
  <div id="game">
    <div id="rock" class="choice"><img src="/rock.png " alt=""></div>
    <div id="papper" class="choice"><img src="/paper.png " alt=""></div>
    <div id="scissor" class="choice"><img src="/scissors.png " alt=""></div>
  </div>

  <div class="winning">
    <div class="you">
        <p id="you">0</p>
        <h2>you</h2>
    </div>
    <div class="comp">
        <p id="comp">0</p>
        <h2>Computer</h2>
    </div>
  </div>
  <div class="message">
    <p id="msg">Play your Game</p>
  </div>
    <script src="script.js"></script>
</body>
</html>
