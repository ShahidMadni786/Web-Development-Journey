<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows</title>
    <style>
        .container{
            background-color: red;
            color: white;
            outline: 5px solid black;
            outline-offset: 5px;
            border-radius: 2px;
            box-shadow: 5px 5px 5px black;
        }
    p{
        text-shadow: 2px 2px 2px red;
    }
    </style>
</head>
<body>
    <p> This paragraph will tell you the actual thing we need to put Shadowson the text
    <div class="container">this is container</div>
</body>
</html>
